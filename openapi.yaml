openapi: 3.1.0
info:
  title: Invoice Keeper
  description: 'Напоминания о регулярных платежах: аренда, подписки, серверы.'
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: Проверка работоспособности
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход по логину и паролю
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
        '429':
          description: 'Слишком много неудачных попыток: вход временно закрыт, заголовок Retry-After'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Нет авторизации
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Завершение текущей сессии
      operationId: logout
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Нет авторизации
      security:
      - HTTPBearer: []
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Смена своего пароля
      description: Обычный пользователь меняет свой пароль, зная текущий. Остальные его сессии завершаются,
        текущая остаётся. Пароль администратора задаётся в .env и здесь не меняется. Неверный текущий
        пароль считается неудачной попыткой входа.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: Текущий пароль неверный или новый совпадает с ним
        '403':
          description: Администратор из .env
        '429':
          description: Слишком много неверных паролей подряд
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/recurring-payments:
    get:
      tags:
      - recurring-payments
      summary: Список регулярных платежей
      operationId: list_recurring_payments
      security:
      - HTTPBearer: []
      parameters:
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringPaymentOut'
                title: Response List Recurring Payments
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - recurring-payments
      summary: Создание регулярного платежа (администратор)
      operationId: create_recurring_payment
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{id}:
    patch:
      tags:
      - recurring-payments
      summary: Изменение регулярного платежа (администратор)
      description: 'Меняет название, сумму и график. Новая сумма действует для неоплаченных периодов со
        сроком с сегодняшнего дня, прошлые и оплаченные периоды сохраняют свою. Новый график задаётся
        вместе с датой ближайшей оплаты (не раньше сегодня): неоплаченные будущие периоды старого графика
        убираются, история остаётся. Валюту изменить нельзя.'
      operationId: update_recurring_payment
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '404':
          description: Платёж не найден или прекращён
        '422':
          description: Нарушено правило правки
    delete:
      tags:
      - recurring-payments
      summary: Прекращение регулярного платежа (администратор)
      description: Платёж и его напоминания прекращаются, история периодов сохраняется.
      operationId: delete_recurring_payment
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{id}/pause:
    post:
      tags:
      - recurring-payments
      summary: Пауза платежа (администратор)
      description: 'С сегодняшнего дня до `until` (не включая) или до возобновления: новые периоды не
        создаются, напоминаний нет. Неоплаченные периоды внутри паузы без чеков убираются, оплаченные
        и прошлые долги остаются. Повторный вызов меняет дату окончания действующей паузы.'
      operationId: pause_recurring_payment
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '404':
          description: Платёж не найден или прекращён
        '422':
          description: Дата окончания не позже сегодня
  /api/v1/recurring-payments/{id}/resume:
    post:
      tags:
      - recurring-payments
      summary: Снятие паузы (администратор)
      description: Сроки с сегодняшнего дня снова создаются и напоминают. Пропущенные на паузе месяцы
        просрочкой не становятся.
      operationId: resume_recurring_payment
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '404':
          description: Платёж не найден или прекращён
        '422':
          description: Платёж не на паузе
  /api/v1/payment-occurrences:
    get:
      tags:
      - payment-occurrences
      summary: 'Список платежей: оплаченные и просроченные'
      operationId: list_payment_occurrences
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceStatus'
          - type: 'null'
          title: Status
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только просроченные или только без просрочки
          title: Overdue
        description: Только просроченные или только без просрочки
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: recurring_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recurring Id
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Показать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Показать историю прекращённых платежей
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Поиск по названию платежа без учёта регистра
          title: Q
        description: Поиск по названию платежа без учёта регистра
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          description: Категория платежа; «-» — платежи без категории
          title: Category
        description: Категория платежа; «-» — платежи без категории
      - name: assignee
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
            pattern: ^(me|-|\d+)$
          - type: 'null'
          description: 'Ответственный: id пользователя, «me» — мои платежи, «-» — без ответственного'
          title: Assignee
        description: 'Ответственный: id пользователя, «me» — мои платежи, «-» — без ответственного'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceOut'
                title: Response List Payment Occurrences
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/export:
    get:
      tags:
      - payment-occurrences
      summary: Выгрузка платежей в CSV
      description: 'Те же фильтры, что у списка, без ограничения по числу строк. Файл под русский Excel:
        разделитель `;`, запятая в суммах, даты ДД.ММ.ГГГГ, UTF-8 с BOM.'
      operationId: export_payment_occurrences
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceStatus'
          - type: 'null'
          title: Status
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только просроченные или только без просрочки
          title: Overdue
        description: Только просроченные или только без просрочки
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: recurring_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recurring Id
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Показать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Показать историю прекращённых платежей
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Поиск по названию платежа без учёта регистра
          title: Q
        description: Поиск по названию платежа без учёта регистра
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          description: Категория платежа; «-» — платежи без категории
          title: Category
        description: Категория платежа; «-» — платежи без категории
      - name: assignee
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
            pattern: ^(me|-|\d+)$
          - type: 'null'
          description: 'Ответственный: id пользователя, «me» — мои платежи, «-» — без ответственного'
          title: Assignee
        description: 'Ответственный: id пользователя, «me» — мои платежи, «-» — без ответственного'
      responses:
        '200':
          description: CSV-файл
          content:
            text/csv: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}:
    get:
      tags:
      - payment-occurrences
      summary: Конкретный платёж
      operationId: get_payment_occurrence
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - payment-occurrences
      summary: Подтверждение или отмена оплаты, исправление фактической даты
      description: Доступно и пользователю, и администратору. Меняет только этот период. `status=paid`
        без даты ставит сегодняшнюю, `status=unpaid` очищает дату. Срок периода не меняется, просрочка
        пересчитывается по фактической дате.
      operationId: update_payment_occurrence
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '409':
          description: Регулярный платёж прекращён
        '422':
          description: Нарушено правило оплаты
  /api/v1/payments/summary:
    get:
      tags:
      - summary
      summary: Итоговые суммы платежей по валютам
      description: 'Суммы считаются отдельно по RUB, USD и EUR, без конвертации. Все три валюты есть всегда.


        Параметр `on` даёт итоги на дату: считаются периоды со сроком не позже этой даты (если не задан
        `due_to`), оплата, отмеченная позже `on`, ещё не учитывается, просрочка считается на `on`.'
      operationId: payments_summary
      security:
      - HTTPBearer: []
      parameters:
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: 'on'
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Итоги на эту дату, по умолчанию сегодня
          title: 'On'
        description: Итоги на эту дату, по умолчанию сегодня
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/budget:
    get:
      tags:
      - summary
      summary: 'Бюджет: плановые расходы на месяц или год по валютам'
      description: 'Считает плановые расходы по каждой валюте отдельно: будущие периоды вычисляются по
        правилу повторения, поэтому бюджет можно строить и на год вперёд. `paid` это уже оплаченное, `remaining`
        остаток. С `month` вернётся один месяц, без него год с разбивкой по месяцам.'
      operationId: payments_budget
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          description: По умолчанию текущий год
          title: Year
        description: По умолчанию текущий год
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Month
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/calendar:
    get:
      tags:
      - summary
      summary: Календарь оплат на месяц
      description: 'Платежи месяца по дням. `status`: `paid`, `unpaid` или `planned` (период ещё не создан,
        он вычислен по правилу повторения). Итоги месяца считаются по валютам отдельно.'
      operationId: payments_calendar
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          title: Year
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Month
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: Список пользователей (администратор)
      description: Только обычные пользователи. Администратор из .env в списке не показывается.
      operationId: list_users
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users
        '403':
          description: Нужна роль администратора
      security:
      - HTTPBearer: []
    post:
      tags:
      - users
      summary: Создание обычного пользователя (администратор)
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Нужна роль администратора
        '409':
          description: Логин занят или зарезервирован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/{id}:
    patch:
      tags:
      - users
      summary: Изменение пользователя (администратор)
      description: Меняет логин и/или пароль. Роль изменить нельзя. Смена пароля завершает сессии пользователя.
      operationId: update_user
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Нужна роль администратора
        '409':
          description: Логин занят или зарезервирован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Удаление пользователя (администратор)
      operationId: delete_user
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Нужна роль администратора
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-log:
    get:
      tags:
      - audit
      summary: Журнал авторизации и действий (администратор)
      description: 'Новые записи первыми. Фильтр `action`: точное имя (`occurrence.paid`) или группа с
        точкой на конце (`auth.`, `payment.`, `occurrence.`, `user.`, `receipt.`, `reminder.`). Пароли
        в журнал не попадают.'
      operationId: list_audit_log
      security:
      - HTTPBearer: []
      parameters:
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 48
          - type: 'null'
          title: Action
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: 'Точное имя: логин или @username'
          title: Actor
        description: 'Точное имя: логин или @username'
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Since
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Until
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryOut'
                title: Response List Audit Log
        '403':
          description: Нужна роль администратора
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}/receipts:
    get:
      tags:
      - receipts
      summary: Чеки и ссылки периода
      operationId: list_receipts
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceiptOut'
                title: Response List Receipts
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}/receipts/link:
    post:
      tags:
      - receipts
      summary: Прикрепить ссылку к оплате
      operationId: add_link
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptLinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptOut'
        '409':
          description: Платёж прекращён или слишком много вложений
        '422':
          description: Некорректная ссылка
  /api/v1/payment-occurrences/{id}/receipts/file:
    post:
      tags:
      - receipts
      summary: Загрузить чек (PDF, PNG, JPEG, WebP)
      description: 'multipart/form-data: поле `file` и необязательное `title`. Тип проверяется по содержимому,
        размер до `RECEIPT_MAX_MB`.'
      operationId: add_file
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_file'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptOut'
        '409':
          description: Платёж прекращён или слишком много вложений
        '413':
          description: Файл слишком большой
        '422':
          description: Недопустимый формат
  /api/v1/receipts/{id}/file:
    get:
      tags:
      - receipts
      summary: Скачать загруженный чек
      operationId: download_receipt
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Нет такого файла
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/receipts/{id}:
    delete:
      tags:
      - receipts
      summary: Удалить чек или ссылку
      description: Удалить может администратор или тот, кто прикрепил.
      operationId: delete_receipt
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Чужое вложение
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/messengers:
    get:
      tags:
      - messengers
      summary: Мои привязки Telegram и MAX
      description: Привязанному аккаунту бот присылает напоминания в личку с кнопкой «Оплачено».
      operationId: my_messengers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MessengerStatusOut'
                type: array
                title: Response My Messengers
      security:
      - HTTPBearer: []
  /api/v1/me/messengers/{messenger}/link:
    post:
      tags:
      - messengers
      summary: Получить ссылку для привязки
      description: 'Одноразовый код на 10 минут. Откройте `url` и нажмите «Старт» (или отправьте боту
        `command`): бот свяжет аккаунт с текущим пользователем. Новая ссылка отменяет прежнюю.'
      operationId: create_link
      security:
      - HTTPBearer: []
      parameters:
      - name: messenger
        in: path
        required: true
        schema:
          enum:
          - telegram
          - max
          type: string
          title: Messenger
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkCodeOut'
        '503':
          description: Бот этого мессенджера не настроен
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/messengers/{messenger}:
    delete:
      tags:
      - messengers
      summary: Отвязать аккаунт
      operationId: remove_link
      security:
      - HTTPBearer: []
      parameters:
      - name: messenger
        in: path
        required: true
        schema:
          enum:
          - telegram
          - max
          type: string
          title: Messenger
      responses:
        '204':
          description: Successful Response
        '404':
          description: Аккаунт не привязан
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/help:
    get:
      tags:
      - help
      summary: Сведения для страницы «Помощь»
      description: Контакты поддержки из .env, боты и каналы напоминаний, настройки сроков. Доступно всем
        вошедшим.
      operationId: help_info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpOut'
      security:
      - HTTPBearer: []
components:
  schemas:
    AuditEntryOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          title: At
        actor_type:
          type: string
          title: Actor Type
          description: admin, user, telegram, max, system или anonymous
        actor:
          type: string
          title: Actor
          description: Логин, @username в Telegram или MAX, либо «планировщик»
        action:
          type: string
          title: Action
          examples:
          - occurrence.paid
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        target_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_type
      - actor
      - action
      title: AuditEntryOut
    Body_add_file:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: PDF, PNG, JPEG или WebP
        title:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      title: Body_add_file
    BudgetCategoryOut:
      properties:
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
          description: Категория; пусто у платежей без категории
        currencies:
          items:
            $ref: '#/components/schemas/BudgetLineOut'
          type: array
          title: Currencies
      type: object
      required:
      - category
      - currencies
      title: BudgetCategoryOut
    BudgetLineOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        planned:
          type: string
          title: Planned
          description: 'Плановые расходы: все периоды выборки, включая будущие'
          examples:
          - '45000.00'
        paid:
          type: string
          title: Paid
          description: Из них уже оплачено
        remaining:
          type: string
          title: Remaining
          description: 'Осталось оплатить: planned минус paid'
        count_planned:
          type: integer
          title: Count Planned
        count_paid:
          type: integer
          title: Count Paid
      type: object
      required:
      - currency
      - planned
      - paid
      - remaining
      - count_planned
      - count_paid
      title: BudgetLineOut
    BudgetMonthOut:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        currencies:
          items:
            $ref: '#/components/schemas/BudgetLineOut'
          type: array
          title: Currencies
      type: object
      required:
      - month
      - currencies
      title: BudgetMonthOut
    BudgetOut:
      properties:
        year:
          type: integer
          title: Year
        month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Month
          description: Пусто, если бюджет считается на год
        currencies:
          items:
            $ref: '#/components/schemas/BudgetLineOut'
          type: array
          title: Currencies
          description: Итог за выбранный месяц или за год, всегда все три валюты
        months:
          anyOf:
          - items:
              $ref: '#/components/schemas/BudgetMonthOut'
            type: array
          - type: 'null'
          title: Months
          description: Разбивка по месяцам, только для года
        categories:
          items:
            $ref: '#/components/schemas/BudgetCategoryOut'
          type: array
          title: Categories
          description: 'Разбивка по категориям: по алфавиту, платежи без категории последними'
          default: []
      type: object
      required:
      - year
      - month
      - currencies
      title: BudgetOut
    CalendarDayOut:
      properties:
        day:
          type: string
          format: date
          title: Day
        items:
          items:
            $ref: '#/components/schemas/CalendarItemOut'
          type: array
          title: Items
      type: object
      required:
      - day
      - items
      title: CalendarDayOut
    CalendarItemOut:
      properties:
        occurrence_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Occurrence Id
          description: Пусто у запланированного периода, которого в базе ещё нет
        recurring_id:
          type: integer
          title: Recurring Id
        name:
          type: string
          title: Name
        amount:
          type: string
          title: Amount
        currency:
          $ref: '#/components/schemas/Currency'
        due_date:
          type: string
          format: date
          title: Due Date
        status:
          type: string
          enum:
          - paid
          - unpaid
          - planned
          title: Status
        paid_at:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Paid At
        is_overdue:
          type: boolean
          title: Is Overdue
        overdue_days:
          type: integer
          title: Overdue Days
        payment_deleted:
          type: boolean
          title: Payment Deleted
        receipts_count:
          type: integer
          title: Receipts Count
          default: 0
      type: object
      required:
      - occurrence_id
      - recurring_id
      - name
      - amount
      - currency
      - due_date
      - status
      - paid_at
      - is_overdue
      - overdue_days
      - payment_deleted
      title: CalendarItemOut
    CalendarOut:
      properties:
        year:
          type: integer
          title: Year
        month:
          type: integer
          title: Month
        today:
          type: string
          format: date
          title: Today
          description: «Сегодня» по часовому поясу сервера
        days:
          items:
            $ref: '#/components/schemas/CalendarDayOut'
          type: array
          title: Days
          description: Только дни, в которые есть платежи
        totals:
          items:
            $ref: '#/components/schemas/BudgetLineOut'
          type: array
          title: Totals
          description: Итоги месяца по валютам
      type: object
      required:
      - year
      - month
      - today
      - days
      - totals
      title: CalendarOut
    ContactOut:
      properties:
        label:
          type: string
          title: Label
          examples:
          - '@joulerkOFF'
        url:
          type: string
          title: Url
          examples:
          - https://t.me/joulerkOFF
      type: object
      required:
      - label
      - url
      title: ContactOut
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencySummaryOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          type: string
          title: Total
          description: Все периоды выборки
        paid:
          type: string
          title: Paid
        unpaid:
          type: string
          title: Unpaid
        overdue:
          type: string
          title: Overdue
          description: Неоплаченные периоды после срока (долг)
        paid_late:
          type: string
          title: Paid Late
          description: Оплаченные позже срока. Вместе с overdue это те же периоды, что в списке с overdue=true
        count_total:
          type: integer
          title: Count Total
        count_paid:
          type: integer
          title: Count Paid
        count_unpaid:
          type: integer
          title: Count Unpaid
        count_overdue:
          type: integer
          title: Count Overdue
        count_paid_late:
          type: integer
          title: Count Paid Late
      type: object
      required:
      - currency
      - total
      - paid
      - unpaid
      - overdue
      - paid_late
      - count_total
      - count_paid
      - count_unpaid
      - count_overdue
      - count_paid_late
      title: CurrencySummaryOut
    CurrentUser:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: Пусто у администратора из .env
        login:
          type: string
          title: Login
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - id
      - login
      - role
      title: CurrentUser
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HelpContactsOut:
      properties:
        telegram:
          anyOf:
          - $ref: '#/components/schemas/ContactOut'
          - type: 'null'
          description: Telegram для вопросов, SUPPORT_TELEGRAM
        email:
          anyOf:
          - $ref: '#/components/schemas/ContactOut'
          - type: 'null'
          description: Почта для вопросов, SUPPORT_EMAIL
        url:
          anyOf:
          - $ref: '#/components/schemas/ContactOut'
          - type: 'null'
          description: Ссылка, например на репозиторий или базу знаний, SUPPORT_URL
      type: object
      required:
      - telegram
      - email
      - url
      title: HelpContactsOut
    HelpOut:
      properties:
        contacts:
          $ref: '#/components/schemas/HelpContactsOut'
        bots:
          additionalProperties:
            $ref: '#/components/schemas/ContactOut'
          type: object
          title: Bots
          description: 'Боты напоминаний, которые настроены на сервере: telegram, max'
        channels:
          items:
            type: string
          type: array
          title: Channels
          description: 'Общие каналы напоминаний: telegram, max, email, webhook'
        reminder_days:
          type: integer
          title: Reminder Days
          description: За сколько дней до срока приходит напоминание
        overdue_reminders:
          type: boolean
          title: Overdue Reminders
          description: Приходит ли повторное напоминание на следующий день после срока
        timezone:
          type: string
          title: Timezone
          description: Часовой пояс, по которому считается «сегодня»
      type: object
      required:
      - contacts
      - bots
      - channels
      - reminder_days
      - overdue_reminders
      - timezone
      title: HelpOut
      description: Всё, что странице «Помощь» нужно знать о настройках сервера.
    LinkCodeOut:
      properties:
        messenger:
          type: string
          enum:
          - telegram
          - max
          title: Messenger
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: 'Ссылка на бота с кодом: открыть и нажать «Старт»'
        command:
          type: string
          title: Command
          description: 'Запасной путь: отправить это сообщение боту в личку'
        expires_at:
          type: string
          title: Expires At
      type: object
      required:
      - messenger
      - url
      - command
      - expires_at
      title: LinkCodeOut
    LoginRequest:
      properties:
        login:
          type: string
          maxLength: 64
          minLength: 1
          title: Login
          examples:
          - admin
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - login
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        token:
          type: string
          title: Token
          description: 'Токен сессии: заголовок Authorization: Bearer <token> или cookie'
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          $ref: '#/components/schemas/CurrentUser'
      type: object
      required:
      - token
      - user
      title: LoginResponse
    LogoutResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
      type: object
      title: LogoutResponse
    MessengerStatusOut:
      properties:
        messenger:
          type: string
          enum:
          - telegram
          - max
          title: Messenger
        title:
          type: string
          title: Title
        available:
          type: boolean
          title: Available
          description: Бот этого мессенджера настроен на сервере
        linked:
          type: boolean
          title: Linked
        account:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
          description: Имя аккаунта в мессенджере, например @ivan
        linked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Linked At
      type: object
      required:
      - messenger
      - title
      - available
      - linked
      - account
      title: MessengerStatusOut
    OccurrenceOut:
      properties:
        id:
          type: integer
          title: Id
        recurring_id:
          type: integer
          title: Recurring Id
        name:
          type: string
          title: Name
        amount:
          type: string
          title: Amount
          examples:
          - '45000.00'
        currency:
          $ref: '#/components/schemas/Currency'
        due_date:
          type: string
          format: date
