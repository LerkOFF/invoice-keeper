# Дополнение для прода на zurih. Подключается через COMPOSE_FILE в .env на сервере:
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.zurih.yml
#
# Провайдер закрывает исходящий SMTP, поэтому письма идут через SSH-туннель
# (deploy/smtp-relay-tunnel.sh): туннель слушает шлюз этой сети на :465,
# а smtp.yandex.ru внутри контейнера указывает на шлюз. TLS-сертификат Яндекса
# при этом проверяется как обычно.
services:
  app:
    extra_hosts:
      - "smtp.yandex.ru:172.31.77.1"
    stop_grace_period: 20s

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.77.0/24
