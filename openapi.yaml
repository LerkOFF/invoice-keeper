openapi: 3.1.0
info:
  title: Invoice Keeper
  description: 'Напоминания о регулярных платежах: аренда, подписки, серверы.'
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: Проверка работоспособности
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход по логину и паролю
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Нет авторизации
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Завершение текущей сессии
      operationId: logout
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Нет авторизации
      security:
      - HTTPBearer: []
  /api/v1/recurring-payments:
    get:
      tags:
      - recurring-payments
      summary: Список регулярных платежей
      operationId: list_recurring_payments
      security:
      - HTTPBearer: []
      parameters:
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringPaymentOut'
                title: Response List Recurring Payments
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - recurring-payments
      summary: Создание регулярного платежа (администратор)
      operationId: create_recurring_payment
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{id}:
    delete:
      tags:
      - recurring-payments
      summary: Прекращение регулярного платежа (администратор)
      description: Платёж и его напоминания прекращаются, история периодов сохраняется.
      operationId: delete_recurring_payment
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences:
    get:
      tags:
      - payment-occurrences
      summary: 'Список платежей: оплаченные и просроченные'
      operationId: list_payment_occurrences
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OccurrenceStatus'
          - type: 'null'
          title: Status
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только просроченные или только без просрочки
          title: Overdue
        description: Только просроченные или только без просрочки
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: recurring_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recurring Id
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Показать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Показать историю прекращённых платежей
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceOut'
                title: Response List Payment Occurrences
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}:
    get:
      tags:
      - payment-occurrences
      summary: Конкретный платёж
      operationId: get_payment_occurrence
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - payment-occurrences
      summary: Подтверждение или отмена оплаты, исправление фактической даты
      description: Доступно и пользователю, и администратору. Меняет только этот период. `status=paid`
        без даты ставит сегодняшнюю, `status=unpaid` очищает дату. Срок периода не меняется, просрочка
        пересчитывается по фактической дате.
      operationId: update_payment_occurrence
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrenceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '409':
          description: Регулярный платёж прекращён
        '422':
          description: Нарушено правило оплаты
  /api/v1/payments/summary:
    get:
      tags:
      - summary
      summary: Итоговые суммы платежей по валютам
      description: 'Суммы считаются отдельно по RUB, USD и EUR, без конвертации. Все три валюты есть всегда.


        Параметр `on` даёт итоги на дату: считаются периоды со сроком не позже этой даты (если не задан
        `due_to`), оплата, отмеченная позже `on`, ещё не учитывается, просрочка считается на `on`.'
      operationId: payments_summary
      security:
      - HTTPBearer: []
      parameters:
      - name: due_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due From
      - name: due_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due To
      - name: 'on'
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Итоги на эту дату, по умолчанию сегодня
          title: 'On'
        description: Итоги на эту дату, по умолчанию сегодня
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/budget:
    get:
      tags:
      - summary
      summary: 'Бюджет: плановые расходы на месяц или год по валютам'
      description: 'Считает плановые расходы по каждой валюте отдельно: будущие периоды вычисляются по
        правилу повторения, поэтому бюджет можно строить и на год вперёд. `paid` это уже оплаченное, `remaining`
        остаток. С `month` вернётся один месяц, без него год с разбивкой по месяцам.'
      operationId: payments_budget
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          description: По умолчанию текущий год
          title: Year
        description: По умолчанию текущий год
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Month
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payments/calendar:
    get:
      tags:
      - summary
      summary: Календарь оплат на месяц
      description: 'Платежи месяца по дням. `status`: `paid`, `unpaid` или `planned` (период ещё не создан,
        он вычислен по правилу повторения). Итоги месяца считаются по валютам отдельно.'
      operationId: payments_calendar
      security:
      - HTTPBearer: []
      parameters:
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          title: Year
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Month
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Учитывать историю прекращённых платежей
          default: false
          title: Include Deleted
        description: Учитывать историю прекращённых платежей
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - users
      summary: Список пользователей (администратор)
      description: Только обычные пользователи. Администратор из .env в списке не показывается.
      operationId: list_users
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users
        '403':
          description: Нужна роль администратора
      security:
      - HTTPBearer: []
    post:
      tags:
      - users
      summary: Создание обычного пользователя (администратор)
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Нужна роль администратора
        '409':
          description: Логин занят или зарезервирован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/{id}:
    patch:
      tags:
      - users
      summary: Изменение пользователя (администратор)
      description: Меняет логин и/или пароль. Роль изменить нельзя. Смена пароля завершает сессии пользователя.
      operationId: update_user
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '403':
          description: Нужна роль администратора
        '409':
          description: Логин занят или зарезервирован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Удаление пользователя (администратор)
      operationId: delete_user
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Нужна роль администратора
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-log:
    get:
      tags:
      - audit
      summary: Журнал авторизации и действий (администратор)
      description: 'Новые записи первыми. Фильтр `action`: точное имя (`occurrence.paid`) или группа с
        точкой на конце (`auth.`, `payment.`, `occurrence.`, `user.`, `receipt.`, `reminder.`). Пароли
        в журнал не попадают.'
      operationId: list_audit_log
      security:
      - HTTPBearer: []
      parameters:
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 48
          - type: 'null'
          title: Action
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: 'Точное имя: логин или @username'
          title: Actor
        description: 'Точное имя: логин или @username'
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Since
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Until
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryOut'
                title: Response List Audit Log
        '403':
          description: Нужна роль администратора
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}/receipts:
    get:
      tags:
      - receipts
      summary: Чеки и ссылки периода
      operationId: list_receipts
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceiptOut'
                title: Response List Receipts
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences/{id}/receipts/link:
    post:
      tags:
      - receipts
      summary: Прикрепить ссылку к оплате
      operationId: add_link
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptLinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptOut'
        '409':
          description: Платёж прекращён или слишком много вложений
        '422':
          description: Некорректная ссылка
  /api/v1/payment-occurrences/{id}/receipts/file:
    post:
      tags:
      - receipts
      summary: Загрузить чек (PDF, PNG, JPEG, WebP)
      description: 'multipart/form-data: поле `file` и необязательное `title`. Тип проверяется по содержимому,
        размер до `RECEIPT_MAX_MB`.'
      operationId: add_file
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_file'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptOut'
        '409':
          description: Платёж прекращён или слишком много вложений
        '413':
          description: Файл слишком большой
        '422':
          description: Недопустимый формат
  /api/v1/receipts/{id}/file:
    get:
      tags:
      - receipts
      summary: Скачать загруженный чек
      operationId: download_receipt
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Нет такого файла
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/receipts/{id}:
    delete:
      tags:
      - receipts
      summary: Удалить чек или ссылку
      description: Удалить может администратор или тот, кто прикрепил.
      operationId: delete_receipt
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Чужое вложение
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuditEntryOut:
      properties:
        id:
          type: integer
          title: Id
        at:
          type: string
          title: At
        actor_type:
          type: string
          title: Actor Type
          description: admin, user, telegram, max, system или anonymous
        actor:
          type: string
          title: Actor
          description: Логин, @username в Telegram или MAX, либо «планировщик»
        action:
          type: string
          title: Action
          examples:
          - occurrence.paid
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        target_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_type
      - actor
      - action
      title: AuditEntryOut
    Body_add_file:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: PDF, PNG, JPEG или WebP
        title:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Title
      type: object
      required:
      - file
      title: Body_add_file
    BudgetLineOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        planned:
          type: string
