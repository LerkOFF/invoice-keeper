# /etc/nginx/sites-available/invoice-keeper.ru (симлинк в sites-enabled).
# Сертификат и редирект на HTTPS добавляет certbot --nginx -d invoice-keeper.ru -d www.invoice-keeper.ru
server {
    listen 80;
    listen [::]:80;
    server_name invoice-keeper.ru www.invoice-keeper.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 6m;  # чеки до 5 МБ
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
