name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Тесты и OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: openapi.yaml совпадает с кодом
        run: python scripts/export_openapi.py --check

  docker-demo:
    name: Запуск по README и сценарий демо
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запуск как в README
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Ждём готовности
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Сценарий демонстрации из задания
        run: python3 scripts/demo.py
      - name: Данные переживают перезапуск
        run: |
          cat > /tmp/snapshot.py <<'PY'
          import json, urllib.request
          base = "http://localhost:8000/api/v1"
          login = urllib.request.Request(f"{base}/auth/login", json.dumps({"login": "admin", "password": "change-me"}).encode(), {"Content-Type": "application/json"})
          token = json.load(urllib.request.urlopen(login))["token"]
          items = urllib.request.Request(f"{base}/payment-occurrences?include_deleted=true&limit=1000", headers={"Authorization": f"Bearer {token}"})
          print(sorted((o["id"], o["status"], o["paid_at"], o["amount"]) for o in json.load(urllib.request.urlopen(items))))
          PY
          python3 /tmp/snapshot.py > before.txt
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/v1/health && break; sleep 2; done
          python3 /tmp/snapshot.py > after.txt
          diff before.txt after.txt && echo "данные на месте: $(wc -c < after.txt) байт"
      - name: Логи приложения
        if: always()
        run: docker compose logs app
      - run: docker compose down -v
        if: always()
